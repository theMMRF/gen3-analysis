on:
  pull_request

name: Wool

jobs:
  runWool:
    if: github.repository_owner == 'uc-cdis' || (github.ref_name != 'feature/selective-file-visibility' && github.head_ref != 'feature/selective-file-visibility')
    name: Run black
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master

    - uses: uc-cdis/wool@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
