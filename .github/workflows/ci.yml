on: push

name: CI

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  Security:
    if: github.repository_owner == 'uc-cdis' || (github.ref_name != 'feature/selective-file-visibility' && github.head_ref != 'feature/selective-file-visibility' && !(github.ref_type == 'tag' && startsWith(github.ref_name, 'ecr-')))
    name: Security Pipeline
    uses: uc-cdis/.github/.github/workflows/securitypipeline.yaml@master
    with:
       python-poetry: 'true'
    secrets: inherit

  UnitTest:
    if: github.repository_owner == 'uc-cdis' || (github.ref_name != 'feature/selective-file-visibility' && github.head_ref != 'feature/selective-file-visibility' && !(github.ref_type == 'tag' && startsWith(github.ref_name, 'ecr-')))
    name: Python Unit Tests
    uses: uc-cdis/.github/.github/workflows/python_unit_test.yaml@master
    with:
       test-script: 'bin/test.sh'
       python-version: '3.9'
       use-cache: true
       run-coveralls: true

  ImageBuildAndPush:
    if: github.repository_owner == 'uc-cdis' || (github.ref_name != 'feature/selective-file-visibility' && github.head_ref != 'feature/selective-file-visibility' && !(github.ref_type == 'tag' && startsWith(github.ref_name, 'ecr-')))
    name: Build Image and Push
    uses: uc-cdis/.github/.github/workflows/image_build_push.yaml@master
    with:
      BUILD_PLATFORMS: "linux/amd64, linux/arm64"
    secrets:
      ECR_AWS_ACCESS_KEY_ID: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
      ECR_AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
